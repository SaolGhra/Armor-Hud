modLoader = "javafml"
loaderVersion = "[1,)"
license = "MIT"
issueTrackerURL = "https://github.com/SaolGhra/Armor-Hud/issues"

[[mods]]
modId = "${id}"
version = "${version}"
displayName = "${name}"
authors = "SaolGhra"
description = '''Displays the durability of your armor in a simple and clean way.'''
logoFile = "armor_hud_logo.png"
displayURL = "https://modrinth.com/mod/armor-hud"

[[dependencies.${id}]]
modId = "neoforge"
${required}
versionRange = "${neoforge}"
ordering = "NONE"
side = "CLIENT"

[[dependencies.${id}]]
modId = "minecraft"
${required}
versionRange = "${minecraft}"
ordering = "NONE"
side = "CLIENT"

# Verification-only screenshot mixin. Templated to the mixin block in verify builds
# (-Parmorhud.verify=true), empty otherwise, so release jars register no mixin.
${verify_mixins}
