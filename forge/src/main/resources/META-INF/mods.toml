modLoader = "javafml"
loaderVersion = "[47,)"
license = "MIT"
issueTrackerURL = "https://github.com/SaolGhra/Armor-Hud/issues"

[[mods]]
modId = "${id}"
version = "${version}"
displayName = "${name}"
authors = "SaolGhra"
description = '''Displays the durability of your armor in a simple and clean way.'''
logoFile = "assets/armor_hud/logo/armor_hud_logo.png"
displayURL = "https://modrinth.com/mod/armor-hud"

[[dependencies.${id}]]
    modId = "forge"
    mandatory = true
    versionRange = "[47,)"
    ordering = "NONE"
    side = "CLIENT"

[[dependencies.${id}]]
    modId = "minecraft"
    mandatory = true
    versionRange = "${minecraft}"
    ordering = "NONE"
    side = "CLIENT"
